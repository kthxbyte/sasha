[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sasha"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
sasha = "sasha.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
