[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sasha"
dynamic = ["version"]
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
sasha = "sasha.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.dynamic]
# Single source of truth: src/sasha/__init__.py's __version__.
# Previously this file and __main__.py each carried their own copy
# of the string, free to drift apart.
version = {attr = "sasha.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
